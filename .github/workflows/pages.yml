# Prüft die Lerninhalte und veröffentlicht den Ordner app/ auf GitHub Pages.
name: Prüfen und veröffentlichen
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lerneinheiten prüfen
        run: node tools/build-index.mjs && git diff --exit-code app/content/units/index.js
      - name: Musterlösungen prüfen
        run: node tools/check-units.mjs
      - name: Logik-Tests
        run: node --test tests/unit.test.mjs
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Versionsstempel setzen
        run: |
          BUILD="$(date -u +%Y%m%d-%H%M)-${GITHUB_SHA::7}"
          sed -i "s/^export const BUILD = 'dev';/export const BUILD = '$BUILD';/" app/version.js
          sed -i "s/^const BUILD = 'dev';/const BUILD = '$BUILD';/" app/sw.js
          grep -q "$BUILD" app/version.js && grep -q "$BUILD" app/sw.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deployment
        uses: actions/deploy-pages@v4
